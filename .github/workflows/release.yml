name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # x86-64 builds come in three levels: baseline (any 64-bit PC), avx2 (x86-64-v3, about
        # 2.2x faster) and avx512 (x86-64-v4). The avx512 builds are not run here because the
        # build machine may lack those instructions.
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, name: arhanpassant-linux-x86_64 }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, name: arhanpassant-linux-x86_64-avx2, cpu: x86-64-v3 }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, name: arhanpassant-linux-x86_64-avx512, cpu: x86-64-v4, nobench: true }
          - { os: macos-latest, target: aarch64-apple-darwin, name: arhanpassant-macos-arm64 }
          - { os: macos-latest, target: x86_64-apple-darwin, name: arhanpassant-macos-x86_64, cross: true }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, name: arhanpassant-windows-x86_64.exe }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, name: arhanpassant-windows-x86_64-avx2.exe, cpu: x86-64-v3 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, name: arhanpassant-windows-x86_64-avx512.exe, cpu: x86-64-v4, nobench: true }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        shell: bash
        run: |
          if [ -n "${{ matrix.cpu }}" ]; then export RUSTFLAGS="-C target-cpu=${{ matrix.cpu }}"; fi
          cargo build --release -p arhanpassant --target ${{ matrix.target }}
      - name: Bench
        shell: bash
        run: |
          bin=target/${{ matrix.target }}/release/arhanpassant
          [ -f "$bin.exe" ] && bin="$bin.exe"
          if [ "${{ matrix.cross }}" != "true" ] && [ "${{ matrix.nobench }}" != "true" ]; then "$bin" bench; fi
          cp "$bin" "${{ matrix.name }}"
      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.name }}
