name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, name: arhanpassant-linux-x86_64 }
          - { os: macos-latest, target: aarch64-apple-darwin, name: arhanpassant-macos-arm64 }
          - { os: macos-13, target: x86_64-apple-darwin, name: arhanpassant-macos-x86_64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, name: arhanpassant-windows-x86_64.exe }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release -p arhanpassant --target ${{ matrix.target }}
      - name: Bench
        shell: bash
        run: |
          bin=target/${{ matrix.target }}/release/arhanpassant
          [ -f "$bin.exe" ] && bin="$bin.exe"
          "$bin" bench
          cp "$bin" "${{ matrix.name }}"
      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.name }}
