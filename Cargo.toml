[workspace]
resolver = "2"
members = ["engine", "arena", "wasm"]

[workspace.package]
version = "0.13.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Arhan Canli"]
repository = "https://github.com/arhancanli/arhanpassant"
homepage = "https://arhanpassant.com"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

# Release speed with symbols, for profiling.
[profile.profiling]
inherits = "release"
debug = true

# pyrrhic-rs 0.2.0 assumes C `char` is signed (true on macOS and x86, not on
# ARM Linux); the vendored copy casts at the six places it meets std's CStr.
[patch.crates-io]
pyrrhic-rs = { path = "vendor/pyrrhic-rs" }
